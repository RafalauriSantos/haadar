name = "haadar"
main = "src/index.ts"
compatibility_date = "2026-09-30"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["0 */3 * * *", "30 1-23/3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "haadar"
database_id = "6e390e86-1164-413b-aec6-f48c1dc4b290"
migrations_dir = "migrations"

[[queues.producers]]
queue = "haadar-discovery"
binding = "HAADAR_DISCOVERY"

[[queues.consumers]]
queue = "haadar-discovery"

# Remote resources are opt-in. Plain `wrangler dev` always uses local emulation.
[env.staging]
name = "haadar-staging"
workers_dev = true

[env.production]
name = "haadar"
workers_dev = true

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["0 */3 * * *", "30 1-23/3 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "haadar"
database_id = "6e390e86-1164-413b-aec6-f48c1dc4b290"
migrations_dir = "migrations"
remote = true

[[env.production.queues.producers]]
queue = "haadar-discovery"
binding = "HAADAR_DISCOVERY"

[[env.production.queues.consumers]]
queue = "haadar-discovery"
