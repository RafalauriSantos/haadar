name = "haadar"
main = "src/index.ts"
compatibility_date = "2026-09-30"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "haadar"
database_id = "6e390e86-1164-413b-aec6-f48c1dc4b290"
migrations_dir = "migrations"

[[queues.producers]]
queue = "haadar-discovery"
binding = "HAADAR_DISCOVERY"

[[queues.consumers]]
queue = "haadar-discovery"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "haadar-discovery-dlq"
max_concurrency = 2
retry_delay = 30

[[workflows]]
name = "haadar-enrichment"
binding = "ENRICHMENT_WORKFLOW"
class_name = "EnrichmentWorkflow"
default_retention = { success_retention = "1 day", error_retention = "2 days" }

# Remote resources are opt-in. Plain `wrangler dev` always uses local emulation.
[env.staging]
name = "haadar-staging"
workers_dev = true

[env.production]
name = "haadar"
workers_dev = true

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["0 * * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "haadar"
database_id = "6e390e86-1164-413b-aec6-f48c1dc4b290"
migrations_dir = "migrations"
remote = true

[[env.production.queues.producers]]
queue = "haadar-discovery"
binding = "HAADAR_DISCOVERY"

[[env.production.queues.consumers]]
queue = "haadar-discovery"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "haadar-discovery-dlq"
max_concurrency = 2
retry_delay = 30

[[env.production.workflows]]
name = "haadar-enrichment"
binding = "ENRICHMENT_WORKFLOW"
class_name = "EnrichmentWorkflow"
default_retention = { success_retention = "1 day", error_retention = "2 days" }
